    <rect x="24" y="280" width="222" height="49" rx="14" fill="white" stroke="#E9DED8"/><circle cx="48" cy="304" r="9" fill="#F4DED4"/><text x="70" y="310" font-family="Arial" font-size="12" fill="#554B46">Je l’adore</text><rect x="24" y="341" width="222" height="49" rx="14" fill="#F4DED4" stroke="#9B482D"/><circle cx="48" cy="365" r="9" fill="#9B482D"/><text x="70" y="371" font-family="Arial" font-size="12" fill="#241F1C">Elle me plaît</text><rect x="24" y="530" width="222" height="48" rx="14" fill="#9B482D"/><text x="111" y="559" font-family="Arial" font-size="13" fill="white">Suivant</text>
