    <rect x="101" y="390" width="67" height="70" rx="14" fill="white" stroke="#E9DED8"/><text x="113" y="418" font-family="Arial" font-size="20" fill="#9B482D">02</text><text x="113" y="442" font-family="Arial" font-size="9" fill="#867A73">tests actifs</text>
    <rect x="178" y="390" width="67" height="70" rx="14" fill="white" stroke="#E9DED8"/><text x="190" y="418" font-family="Arial" font-size="20" fill="#9B482D">86</text><text x="190" y="442" font-family="Arial" font-size="9" fill="#867A73">réponses</text>
