<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><rect width="390" height="844" fill="#FFFDFC"/><text x="28" y="40" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#4A2630" text-anchor="start">Sutura</text><text x="362" y="39" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#E90046" text-anchor="end">S</text><text x="28" y="96" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#4A2630" text-anchor="start">Merci pour ta réponse ✦</text><text x="28" y="123" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#75666A" text-anchor="start">Ton avis a bien été enregistré.</text><circle cx="195" cy="246" r="62" fill="#F5D500"/><text x="195" y="266" font-family="Arial,Helvetica,sans-serif" font-size="50" font-weight="700" fill="#4A2630" text-anchor="middle">✓</text><text x="195" y="380" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#4A2630" text-anchor="middle">C’est envoyé.</text><text x="195" y="418" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#75666A" text-anchor="middle">Tes réponses nous aideront à améliorer</text><text x="195" y="442" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#75666A" text-anchor="middle">la prochaine collection.</text><rect x="28" y="650" width="334" height="52" rx="14" fill="#4A2630" stroke="none" stroke-width="1"/><text x="195" y="682" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Fermer</text></svg>