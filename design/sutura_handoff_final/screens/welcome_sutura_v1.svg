<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A84D31"/>
      <stop offset="1" stop-color="#7F3424"/>
    </linearGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7C5A2" stop-opacity=".9"/>
      <stop offset=".48" stop-color="#C9643F" stop-opacity=".6"/>
      <stop offset="1" stop-color="#7F3424" stop-opacity=".2"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#6E2E20" flood-opacity=".18"/>
    </filter>
    <clipPath id="visualClip"><rect x="20" y="126" width="350" height="346" rx="28"/></clipPath>
  </defs>

  <rect width="390" height="844" fill="#FCF9F6"/>

  <!-- Top navigation -->
  <text x="32" y="56" fill="#9B482D" font-family="Georgia, serif" font-size="31" font-style="italic">Sutura</text>
  <text x="358" y="53" text-anchor="end" fill="#867A73" font-family="Arial, sans-serif" font-size="12">Passer</text>

  <!-- Editorial visual -->
  <g filter="url(#shadow)">
    <rect x="20" y="126" width="350" height="346" rx="28" fill="url(#clay)"/>
  </g>
  <g clip-path="url(#visualClip)">
    <path d="M-50 337 C35 210 65 443 157 295 S303 144 445 269" fill="none" stroke="#F8D2B9" stroke-opacity=".38" stroke-width="70"/>
    <path d="M-80 404 C28 238 85 515 178 346 S298 193 460 302" fill="none" stroke="url(#silk)" stroke-opacity=".65" stroke-width="34"/>
    <path d="M-60 201 C47 355 85 118 179 246 S301 393 440 210" fill="none" stroke="#5D271E" stroke-opacity=".23" stroke-width="23"/>
    <path d="M-40 470 C57 321 104 493 184 365 S320 238 432 362" fill="none" stroke="#F7B993" stroke-opacity=".45" stroke-width="10"/>
    <circle cx="285" cy="231" r="74" fill="#FCF9F6" fill-opacity=".08"/>
    <circle cx="285" cy="231" r="48" fill="none" stroke="#FCF9F6" stroke-opacity=".35" stroke-width="1.5"/>
    <path d="M260 230c8-20 41-22 50-1-9 17-36 34-50 1Z" fill="#FCF9F6" fill-opacity=".72"/>
    <path d="M272 229c6-8 18-8 25 0" fill="none" stroke="#9B482D" stroke-width="2"/>
    <text x="46" y="425" fill="#FCF9F6" fill-opacity=".8" font-family="Arial, sans-serif" font-size="10" letter-spacing="2">ATELIER / SIGNAL / DÉCISION</text>
  </g>

  <!-- Copy -->
  <text x="24" y="535" fill="#241F1C" font-family="Georgia, serif" font-size="31" font-weight="bold">
    <tspan x="24" dy="0">Donne une forme</tspan>
    <tspan x="24" dy="37">à tes intuitions.</tspan>
  </text>
  <text x="24" y="624" fill="#554B46" font-family="Arial, sans-serif" font-size="15">
    <tspan x="24" dy="0">Crée ta collection, écoute ton audience</tspan>
    <tspan x="24" dy="23">et avance avec des décisions plus sûres.</tspan>
  </text>

  <!-- Progress -->
  <g transform="translate(24 684)">
    <rect width="48" height="4" rx="2" fill="#9B482D"/>
    <rect x="56" width="24" height="4" rx="2" fill="#E9DED8"/>
    <rect x="88" width="24" height="4" rx="2" fill="#E9DED8"/>
    <text x="342" y="5" text-anchor="end" fill="#867A73" font-family="Arial, sans-serif" font-size="11">01 / 03</text>
  </g>

  <!-- Actions -->
  <rect x="24" y="720" width="342" height="52" rx="14" fill="#9B482D"/>
  <text x="195" y="753" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15" font-weight="bold">Commencer</text>
  <text x="195" y="810" text-anchor="middle" fill="#9B482D" font-family="Arial, sans-serif" font-size="14">J’ai déjà un compte</text>
</svg>
