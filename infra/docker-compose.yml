name: sutura

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: sutura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sutura-net

  api:
    image: ${API_IMAGE:-sutura-api:local}
    container_name: sutura-api
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      BUILD_REF: ${GIT_REF:-unknown}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:-${PUBLIC_APP_URL}}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-${PUBLIC_APP_URL}}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_UPLOAD_SECRET: ${LOCAL_UPLOAD_SECRET}
      IMOLE_API_KEY: ${IMOLE_API_KEY:-}
      IMOLE_BASE_URL: ${IMOLE_BASE_URL:-https://api.imole.app/v1}
      IMOLE_MODEL: ${IMOLE_MODEL:-gpt-5.6-luna}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
    networks:
      - sutura-net

  postfix:
    image: boky/postfix:latest@sha256:aafc772384232497bed875e1eb66b4d3e54ba1ebc86e2e185a6dc1dbc48182ef
    container_name: sutura-postfix-container
    restart: unless-stopped
    hostname: mail.suturamode.com
    environment:
      ALLOWED_SENDER_DOMAINS: suturamode.com
      MESSAGE_SIZE_LIMIT: 26214400
      RELAYHOST: ""
    networks:
      - sutura-net

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: sutura-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-unused@nowhere.local}
      CADDY_PRIMARY_DOMAIN: ${CADDY_PRIMARY_DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    networks:
      - sutura-net

  backup:
    build:
      context: ./backup
    image: sutura-backup:local
    container_name: sutura-backup
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      RCLONE_CONFIG_R2_ENDPOINT: https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      BACKUP_BUCKET: ${R2_BUCKET}
      BACKUP_PREFIX: backups/db
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sutura-net

  migrate:
    image: ${API_IMAGE:-sutura-api:local}
    container_name: sutura-migrate
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    entrypoint: ["npx", "prisma", "migrate", "deploy"]
    networks:
      - sutura-net

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  sutura-net:
    driver: bridge
